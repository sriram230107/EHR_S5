<form method="GET" action="{{ url_for('main.search_patients') }}" class="w-100">
    <div class="input-group shadow-sm">
        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
        <input type="text" name="query" class="form-control border-start-0 ps-0" placeholder="Search by MRN, name, phone, or DOB (YYYY-MM-DD)..." value="{{ request.args.get('query', '') }}">
        <button class="btn btn-primary px-4 fw-medium" type="submit">Search</button>
    </div>
</form>
