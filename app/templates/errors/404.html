<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - EHR Clinical Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 3rem 2rem;
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            color: #0d6efd; /* Medical Blue */
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-file-earmark-medical-fill"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">404</h1>
        <h4 class="fw-semibold text-secondary mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">
            The page you are looking for does not exist or may have been relocated.
        </p>
        <div class="d-grid gap-2 col-8 mx-auto">
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                <i class="bi bi-house-door-fill me-2"></i>Go to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
